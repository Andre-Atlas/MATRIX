name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matrix
          POSTGRES_PASSWORD: matrix
          POSTGRES_DB: matrix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matrix" --health-interval 5s --health-timeout 5s --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports: ["8123:8123"]
    env:
      MATRIX_TEST_DATABASE_URL: postgresql+psycopg://matrix:matrix@localhost:5432/matrix_test
      MATRIX_TEST_CLICKHOUSE_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Wait for ClickHouse
        run: for i in $(seq 1 30); do curl -sf http://localhost:8123/ping && break; sleep 2; done
      - run: uv run pytest -q
      - name: Migrations apply and match the models
        env:
          MATRIX_DATABASE_URL: postgresql+psycopg://matrix:matrix@localhost:5432/matrix_test
        run: |
          uv run python -c "from matrix_server.storage.db import Base, make_engine; Base.metadata.drop_all(make_engine('$MATRIX_DATABASE_URL'))"
          uv run alembic upgrade head
          uv run alembic check

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
