[project]
name = "matrix-sdk"
version = "0.1.0"
description = "MATRIX Python SDK"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "httpx",
    "psutil>=5.9",
]

[project.optional-dependencies]
hf = ["transformers"]
torch = ["torch"]
sklearn = ["scikit-learn"]
xgboost = ["xgboost"]
lightgbm = ["lightgbm"]
shap = ["shap"]
gpu = ["nvidia-ml-py"]

[dependency-groups]
dev = [
    "accelerate>=1.15.0",
    "lightgbm>=4.7.0",
    "pytest",
    "ruff",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_sdk"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
