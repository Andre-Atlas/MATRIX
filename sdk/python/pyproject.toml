[project]
name = "matrix-sdk"
version = "0.1.0"
description = "MATRIX Python SDK"
requires-python = ">=3.12"
dependencies = ["opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http", "httpx"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_sdk"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
