[project]
name = "matrix-server"
version = "0.1.0"
description = "MATRIX LLMOps server"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "clickhouse-connect",
  "opentelemetry-proto",
  "protobuf",
  "httpx",
  "jsonschema",
  "psycopg[binary]",
  "alembic>=1.20.1",
  "regex>=2026.9.29",
  "boto3>=1.43.127",
  "argon2-cffi>=25.1.0",
  "cryptography>=50.0.2",
]

[project.optional-dependencies]
# Real benchmark engines (ADR-016, L3). Heavy; the engines answer EngineUnavailable without them.
engines = ["lm-eval[api,ifeval]==0.4.13"]

[project.scripts]
matrix-api = "matrix_server.cli:run_api"
matrix-worker = "matrix_server.cli:run_worker"
matrix-admin = "matrix_server.cli:admin"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_server"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: tests requiring a live Docker daemon"]
