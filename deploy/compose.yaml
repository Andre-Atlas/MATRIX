name: matrix

# Required variables (put them in deploy/.env; see README "Stack completa via docker compose"):
# POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD (URL-safe characters: they are embedded in URLs).
# MATRIX_WEB_ORIGIN is required (public origin of the web, e.g. https://matrix.example.com; for local
# use http://localhost:3000 plus MATRIX_INSECURE_COOKIES=1 if you serve plain HTTP). deploy/.env.example
# lists every variable. The web has its own login (users/sessions) and holds no API key.
# Published ports bind to 127.0.0.1 only: put a TLS reverse proxy in front to expose them.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: matrix
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: matrix
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Production artifacts use the local volume (MATRIX_ARTIFACT_BACKEND=local).
  # An optional S3-compatible service (rustfs) is available ONLY under the dev profile (`--profile dev`).
  rustfs:
    profiles: ["dev"]
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in deploy/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in deploy/.env}
    volumes:
      - rustfs-data:/data

  api:
    build: ../server
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec matrix-api"]
    environment: &server-env
      MATRIX_DATABASE_URL: postgresql+psycopg://matrix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/matrix
      MATRIX_SPAN_STORE: clickhouse
      MATRIX_CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/.env}@clickhouse:8123
      MATRIX_ADMIN_TOKEN: ${MATRIX_ADMIN_TOKEN:-}
      MATRIX_TRUSTED_PROXY_HEADER: ${MATRIX_TRUSTED_PROXY_HEADER:-}
      # CIDRs whose connections may set MATRIX_TRUSTED_PROXY_HEADER (empty = the header is never
      # trusted). To use the header, list the compose network the web container talks from, e.g.
      # MATRIX_TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16 (example: narrow it to your
      # network). Without a trusted real IP the per-IP login lock is off; pair and e-mail locks stay.
      MATRIX_TRUSTED_PROXIES: ${MATRIX_TRUSTED_PROXIES:-}
      MATRIX_PASSWORD_HASH_CONCURRENCY: ${MATRIX_PASSWORD_HASH_CONCURRENCY:-4}
      MATRIX_MAX_RUNS_PER_PROJECT: ${MATRIX_MAX_RUNS_PER_PROJECT:-100000}
      MATRIX_MAX_ACTIVE_RUNS_PER_PROJECT: ${MATRIX_MAX_ACTIVE_RUNS_PER_PROJECT:-1000}
      MATRIX_ARTIFACT_BACKEND: ${MATRIX_ARTIFACT_BACKEND:-local}
      MATRIX_ARTIFACT_LOCAL_DIR: /app/artifacts
      MATRIX_SECRET_KEY: ${MATRIX_SECRET_KEY:-}
      MATRIX_SANDBOX_IMAGES: ${MATRIX_SANDBOX_IMAGES:-python:3.12-slim}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes:
      - artifacts-data:/app/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: ../server
    restart: unless-stopped
    command: ["matrix-worker"]
    volumes:
      - artifacts-data:/app/artifacts
    environment:
      <<: *server-env
      # Judge for experiments and online evals. Empty provider = offline heuristic judge
      # (tests/demo only; the worker logs a warning and scores are labelled "heuristic").
      MATRIX_JUDGE_PROVIDER: ${MATRIX_JUDGE_PROVIDER:-}
      MATRIX_JUDGE_MODEL: ${MATRIX_JUDGE_MODEL:-}
      MATRIX_EMBEDDING_MODEL: ${MATRIX_EMBEDDING_MODEL:-}
      MATRIX_OPENAI_BASE_URL: ${MATRIX_OPENAI_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy  # migrations run in the api container first

  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      MATRIX_API_URL: http://api:8000
      MATRIX_WEB_ORIGIN: ${MATRIX_WEB_ORIGIN:?defina a origem pública, ex. https://matrix.exemplo.com}
      MATRIX_WEB_TRUST_FORWARDED_FOR: ${MATRIX_WEB_TRUST_FORWARDED_FOR:-0}
      MATRIX_TRUSTED_PROXY_HEADER: ${MATRIX_TRUSTED_PROXY_HEADER:-}
      MATRIX_INSECURE_COOKIES: ${MATRIX_INSECURE_COOKIES:-}  # 1 only for local plain HTTP
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  artifacts-data:
  clickhouse-data:
  postgres-data:
  rustfs-data:
