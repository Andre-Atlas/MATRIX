name: matrix

# Required variables (put them in deploy/.env; see README "Stack completa via docker compose"):
# POSTGRES_PASSWORD, CLICKHOUSE_PASSWORD (URL-safe characters: they are embedded in URLs).
# Published ports bind to 127.0.0.1 only: the web has no login yet and MATRIX_API_KEY gives full
# read/write access to whoever reaches port 3000. Expose it only behind an authenticating proxy.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: matrix
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: matrix
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix"]
      interval: 5s
      timeout: 3s
      retries: 20

  # No S3/MinIO service: nothing uses S3 yet. The S3 artifact store (cycle 2) comes back with a
  # pinned S3-compatible image.

  api:
    build: ../server
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec matrix-api"]
    environment: &server-env
      MATRIX_DATABASE_URL: postgresql+psycopg://matrix:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/matrix
      MATRIX_SPAN_STORE: clickhouse
      MATRIX_CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/.env}@clickhouse:8123
      MATRIX_ADMIN_TOKEN: ${MATRIX_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: ../server
    restart: unless-stopped
    command: ["matrix-worker"]
    environment:
      <<: *server-env
      # Judge for experiments and online evals. Empty provider = offline heuristic judge
      # (tests/demo only; the worker logs a warning and scores are labelled "heuristic").
      MATRIX_JUDGE_PROVIDER: ${MATRIX_JUDGE_PROVIDER:-}
      MATRIX_JUDGE_MODEL: ${MATRIX_JUDGE_MODEL:-}
      MATRIX_EMBEDDING_MODEL: ${MATRIX_EMBEDDING_MODEL:-}
      MATRIX_OPENAI_BASE_URL: ${MATRIX_OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy  # migrations run in the api container first

  web:
    build: ../apps/web
    restart: unless-stopped
    environment:
      MATRIX_API_URL: http://api:8000
      MATRIX_API_KEY: ${MATRIX_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  clickhouse-data:
  postgres-data:
